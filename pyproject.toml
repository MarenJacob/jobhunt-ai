[project]
name = "jobhunt-ai"
version = "2.0.0"
description = "Autonomous AI career search and application agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.12",
  "uvicorn[standard]>=0.34.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.20",
  "pydantic-settings>=2.8.1",
  "sqlalchemy>=2.0.40",
  "psycopg[binary]>=3.2.6",
  "httpx>=0.28.1",
  "beautifulsoup4>=4.13.3",
  "python-dotenv>=1.1.0",
  "openai>=1.68.2",
  "pypdf>=5.4.0",
  "python-docx>=1.1.2"
]

[tool.vercel]
python_runtime = "python3.12"
